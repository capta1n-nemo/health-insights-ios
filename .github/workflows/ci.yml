name: iOS CI

# Verifies the Health Insights app on every push:
#   1. Runs the pure-Swift InsightKit unit tests (clinical math, risk ensemble,
#      Oura/Withings JSON parsers).
#   2. Compiles the full SwiftUI/HealthKit/SwiftData app target for iOS.
#
# Runs on a macOS runner because the app target needs the iOS SDK.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The repo's own lint, run where nothing local can skip it.
  #
  # `verify.sh` is enforced locally by a PreToolUse hook, and that enforcement is
  # circular: the hook is what runs the lint, and the lint is what checks the hook
  # still exists. Delete or chmod -x the hook script and the whole thing fails
  # open silently. Running it here breaks the circle — this job exists
  # independently of any harness, and its verdict feeds refs/ci/failed, which the
  # close-out gate already reads.
  #
  # Ubuntu and no toolchain: the lint is pure text checks and takes under a
  # second. The Swift suite is `unit-tests` below.
  lint:
    name: Repo lint (verify.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run verify.sh
        run: ./scripts/verify.sh

  unit-tests:
    name: InsightKit unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Run swift test
        working-directory: InsightKit
        run: swift test --parallel

  app-build:
    name: Compile app target
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version
      - name: Build HealthInsights (no signing)
        run: |
          xcodebuild build \
            -project HealthInsights.xcodeproj \
            -scheme HealthInsights \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

  # Publishes the verdict as a git ref, so an agent can ask "did CI pass for
  # this SHA" with `git ls-remote` — a few hundred bytes — instead of the
  # GitHub Actions API, whose smallest run listing is ~450 KB (>100K tokens).
  # That single call was the largest avoidable token cost in an agent session.
  #
  # Read it with: scripts/ci-status.sh [sha]
  record-status:
    name: Record CI result
    needs: [lint, unit-tests, app-build]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Push verdict to refs/ci/<result>/<sha>
        run: |
          set -euo pipefail
          if [ "${{ needs.lint.result }}" = "success" ] \
             && [ "${{ needs.unit-tests.result }}" = "success" ] \
             && [ "${{ needs.app-build.result }}" = "success" ]; then
            result=passed
          else
            result=failed
          fi
          echo "CI $result for $GITHUB_SHA"
          # A ref under refs/ci/ cannot trigger a workflow, so this cannot loop.
          git push -f origin "HEAD:refs/ci/$result/$GITHUB_SHA"
