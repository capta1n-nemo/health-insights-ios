name: Deploy to iPhone over Wi-Fi

# Builds the app on your self-hosted macOS runner and installs it onto your
# iPhone (paired to that Mac, over USB or Wi-Fi) using devicectl.
#
# One-time setup on the runner Mac:
#   • Open HealthInsights.xcodeproj in Xcode once, sign in with your Apple ID
#     (Settings ▸ Accounts), and let "Automatically manage signing" create the
#     development certificate. That certificate is what this workflow reads the
#     Apple Team ID from — no secrets needed.
#   • Pair your iPhone (Xcode ▸ Window ▸ Devices and Simulators ▸ "Connect via
#     network") so it's reachable over Wi-Fi, and trust the Mac on the phone.
# Optional repo secrets (Settings ▸ Secrets and variables ▸ Actions), only if
# auto-detection picks the wrong one:
#   • DEVELOPMENT_TEAM  – your 10-character Apple Team ID.
#   • IPHONE_DEVICE_ID  – the target device's identifier.
#   • KEYCHAIN_PASSWORD – your Mac login password. Needed only when the runner
#     is installed as a background service, which leaves it unable to use the
#     signing key (codesign fails with errSecInternalComponent). The
#     alternative, with no secret, is to run the runner interactively:
#     `sudo ./svc.sh stop` then `./run.sh` from Terminal while logged in.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted
    env:
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      IPHONE_DEVICE_ID: ${{ secrets.IPHONE_DEVICE_ID }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Resolve Apple Team ID
        run: |
          set -eo pipefail
          TEAM="${DEVELOPMENT_TEAM:-}"

          # The Team ID is the OU field of the development certificate's subject.
          if [ -z "$TEAM" ]; then
            PEM="$RUNNER_TEMP/dev-certs.pem"
            : > "$PEM"
            for CN in "Apple Development" "iPhone Developer" "Apple Distribution"; do
              security find-certificate -a -c "$CN" -p >> "$PEM" 2>/dev/null || true
            done
            if [ -s "$PEM" ]; then
              rm -f "$RUNNER_TEMP"/cert-*.pem
              csplit -s -z -f "$RUNNER_TEMP/cert-" -b '%02d.pem' \
                "$PEM" '/BEGIN CERTIFICATE/' '{*}' 2>/dev/null || true
              for f in "$RUNNER_TEMP"/cert-*.pem; do
                [ -e "$f" ] || continue
                OU=$(openssl x509 -in "$f" -noout -subject -nameopt sep_multiline,utf8 2>/dev/null \
                     | sed -n 's/^[[:space:]]*OU=//p' | head -n 1)
                if [ -n "$OU" ]; then TEAM="$OU"; break; fi
              done
            fi
          fi

          # Fall back to any provisioning profile Xcode has already installed.
          if [ -z "$TEAM" ]; then
            for DIR in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                       "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              [ -d "$DIR" ] || continue
              for p in "$DIR"/*.mobileprovision; do
                [ -e "$p" ] || continue
                T=$(security cms -D -i "$p" 2>/dev/null \
                    | plutil -extract TeamIdentifier.0 raw - 2>/dev/null || true)
                if [ -n "$T" ]; then TEAM="$T"; break 2; fi
              done
            done
          fi

          if [ -z "$TEAM" ]; then
            echo "::error::No Apple development certificate found on this runner. Open HealthInsights.xcodeproj in Xcode on this Mac, sign in under Settings ▸ Accounts, and let automatic signing create a certificate — or set the DEVELOPMENT_TEAM repo secret."
            security find-identity -v -p codesigning || true
            exit 1
          fi

          echo "Using Apple Team ID $TEAM"
          echo "TEAM_ID=$TEAM" >> "$GITHUB_ENV"

      # codesign fails with errSecInternalComponent when the runner process
      # can't reach the signing key — either the login keychain is locked, or
      # codesign isn't on the key's ACL. Both are fixed here when the runner's
      # macOS login password is available as the KEYCHAIN_PASSWORD secret.
      - name: Unlock signing keychain
        if: env.KEYCHAIN_PASSWORD != ''
        run: |
          set -eo pipefail
          KC="$HOME/Library/Keychains/login.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KC" > /dev/null
          security list-keychains -d user -s "$KC"

      # Stamp the build so Settings can say exactly which deploy is installed.
      # The checkout is fresh each run, so editing Info.plist in place is safe.
      - name: Stamp build identity
        run: |
          set -eo pipefail
          PLIST=Support/Info.plist
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SHORT_SHA=$(git rev-parse --short HEAD)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :BuildDate string ${BUILD_DATE}" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :BuildDate ${BUILD_DATE}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :GitCommit string ${SHORT_SHA}" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :GitCommit ${SHORT_SHA}" "$PLIST"
          echo "build ${GITHUB_RUN_NUMBER} · ${SHORT_SHA} · ${BUILD_DATE}"

      - name: Build (signed for device)
        run: |
          set -o pipefail
          STATUS=0
          xcodebuild \
            -project HealthInsights.xcodeproj \
            -scheme HealthInsights \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -allowProvisioningUpdates \
            -skipPackagePluginValidation \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            build 2>&1 | tee "$RUNNER_TEMP/build.log" || STATUS=$?
          if [ "$STATUS" -ne 0 ] && grep -q "errSecInternalComponent" "$RUNNER_TEMP/build.log"; then
            echo "::error::codesign could not use the signing key (errSecInternalComponent). The runner can't reach the login keychain. Fix by either (a) adding your Mac login password as the KEYCHAIN_PASSWORD repo secret, or (b) running the Actions runner interactively — stop the service with 'sudo ./svc.sh stop' and run './run.sh' from Terminal while logged in."
          fi
          exit "$STATUS"

      - name: Install onto iPhone
        run: |
          set -eo pipefail
          APP_PATH=$(find build/Build/Products/Debug-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app was produced by the build step."
            exit 1
          fi

          # The target device is pinned, never auto-detected: several iPhones are
          # paired to this Mac and the app must only ever reach the intended one
          # (the iPhone 16 Pro). The IPHONE_DEVICE_ID secret overrides it — needed
          # after an erase/restore, which issues the device a new identifier.
          DEVICE="${IPHONE_DEVICE_ID:-26642940-2E82-5266-8527-0A0351F9D4D8}"

          # Confirm the pinned device is the one that's reachable before installing,
          # so a mismatch fails loudly instead of landing somewhere unexpected. The
          # device table is not echoed — it would publish every paired device's
          # identifier into the public run log.
          xcrun devicectl list devices --json-output "$RUNNER_TEMP/devices.json" > /dev/null 2>&1 || true
          SUMMARY=$(python3 -c "
          import json, sys
          target = sys.argv[2]
          try:
              devices = json.load(open(sys.argv[1]))['result']['devices']
          except Exception:
              print('unknown|unknown'); raise SystemExit
          for d in devices:
              if d.get('identifier') == target:
                  model = d.get('hardwareProperties', {}).get('marketingName', 'unknown')
                  state = d.get('connectionProperties', {}).get('tunnelState', 'unknown')
                  print(model + '|' + state); break
          else:
              print('absent|absent')
          " "$RUNNER_TEMP/devices.json" "$DEVICE")
          MODEL="${SUMMARY%%|*}"
          STATE="${SUMMARY##*|}"

          if [ "$STATE" = "absent" ]; then
            echo "::error::The pinned device is not paired with this Mac. Pair it in Xcode ▸ Window ▸ Devices and Simulators, or correct the IPHONE_DEVICE_ID secret."
            exit 1
          fi
          if [ "$STATE" != "connected" ] && [ "$STATE" != "unknown" ]; then
            echo "::error::The pinned device ($MODEL) is paired but not reachable (state: $STATE). Unlock it, make sure it's on the same network, and re-run."
            exit 1
          fi

          echo "Installing $APP_PATH onto the pinned device ($MODEL)"
          xcrun devicectl device install app --device "$DEVICE" "$APP_PATH"
