# XcodeGen spec — the authoritative, reproducible way to (re)generate the Xcode
# project. If the committed HealthInsights.xcodeproj ever gets out of sync or
# won't open, install XcodeGen and regenerate:
#
#     brew install xcodegen
#     cd ios && xcodegen generate
#
name: HealthInsights
options:
  bundleIdPrefix: com.healthinsights
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  InsightKit:
    path: InsightKit

targets:
  # ⚠️ **The widget extension is defined below and is COMMENTED OUT.** Backlog
  # `D8`. Uncommenting it — plus the `dependencies` entry on the app target that
  # embeds it — is the whole of "switch the widget on", and it will turn the
  # deploy red until two things exist that this repo cannot grant itself. Read
  # `docs/widgets.md` first; it names both, and what happens if you skip them.
  #
  # It is parked rather than deleted for the reason `ShotsyImportAction`'s revert
  # is documented rather than forgotten: the next session to reach for this must
  # find the finished answer *and* the reason it is off, not rediscover the
  # signing wall from a red `main`.
  HealthInsights:
    type: application
    platform: iOS
    sources:
      - path: HealthInsights
    dependencies:
      - package: InsightKit
    info:
      path: Support/Info.plist
    scheme:
      testTargets:
        - HealthInsightsTests
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.jasonsalway.healthinsights
        PRODUCT_NAME: HealthInsights
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: Support/HealthInsights.entitlements
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
    # To embed the widget, add alongside `- package: InsightKit` above:
    #   - target: HealthInsightsWidgets
    #     embed: true

  # ─────────────────────────────────────────────────────────────────────────
  # PARKED — the home-screen widget. Backlog `D8`. See `docs/widgets.md`.
  #
  # Uncommenting this alone is not enough and not safe:
  #   • `Support/HealthInsightsWidgets.entitlements` must exist and declare
  #     `com.apple.security.application-groups` =
  #     ["group.com.jasonsalway.healthinsights"], and the SAME group must be
  #     added to `Support/HealthInsights.entitlements`. Without it the widget
  #     reads an empty container and shows its placeholder forever — silently,
  #     which is why `WidgetSnapshotStore.isVisibleToWidgets` exists.
  #   • App Groups cannot be signed by a free personal team, and the deploy
  #     runner has no Xcode account to mint a profile for a second bundle id.
  #     Both blockers are quoted verbatim in `docs/deployment.md`.
  #
  # Note `sources`: two files from the app target are compiled into the
  # extension as well. An extension cannot link the containing app, so a shared
  # view has to be shared by *source*. Keep that list at two — anything longer
  # means logic has drifted out of InsightKit, where the tests are.
  #
  # HealthInsightsWidgets:
  #   type: app-extension
  #   platform: iOS
  #   sources:
  #     - path: HealthInsightsWidgets
  #     - path: HealthInsights/Features/Widgets/DailyNumberWidgetView.swift
  #     - path: HealthInsights/DesignSystem/Theme.swift
  #   dependencies:
  #     - package: InsightKit
  #   settings:
  #     base:
  #       PRODUCT_BUNDLE_IDENTIFIER: com.jasonsalway.healthinsights.Widgets
  #       PRODUCT_NAME: HealthInsightsWidgets
  #       CODE_SIGN_ENTITLEMENTS: Support/HealthInsightsWidgets.entitlements
  #       SWIFT_VERSION: "5.9"
  #       TARGETED_DEVICE_FAMILY: "1"
  #       GENERATE_INFOPLIST_FILE: YES
  #       INFOPLIST_KEY_CFBundleDisplayName: Health Insights
  #       INFOPLIST_KEY_NSExtensionPointIdentifier: com.apple.widgetkit-extension
  # ─────────────────────────────────────────────────────────────────────────

  # The app target's unit tests. Added 2026-08-07 — before that the app target
  # had none at all, and 39% of the shipped Swift (every render site, every
  # visibility gate, every `AppModel` transition) was checked only by a compile.
  #
  # ⚠️ **Mac-only, permanently.** A unit-test bundle hosted in an iOS app needs
  # the iOS SDK to build and an iOS simulator to run. Hosted Linux sessions have
  # neither, and neither does `ci.yml`'s runner — so **CI does not and cannot
  # gate this target**, and nobody should treat that as an oversight.
  # `scripts/verify.sh --tests` runs it on Darwin and says so out loud when it
  # skips it. See HealthInsightsTests/AppTargetTestSupport.swift.
  #
  # Hosted (TEST_HOST/BUNDLE_LOADER) rather than standalone, so the app's 28k
  # lines are compiled once for the app and the test bundle links against them.
  # It deliberately does **not** take its own InsightKit package dependency:
  # SwiftPM products build as static libraries here, a second copy inside the
  # test bundle would give the same types two sets of metadata in one process,
  # and `@testable import HealthInsights` would then hand back values the test's
  # own `InsightKit` types do not match. SWIFT_INCLUDE_PATHS gives the compiler
  # the module; BUNDLE_LOADER resolves the symbols against the host at link time.
  HealthInsightsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HealthInsightsTests
    dependencies:
      - target: HealthInsights
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jasonsalway.healthinsights.tests
        PRODUCT_NAME: HealthInsightsTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HealthInsights.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/HealthInsights"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_INCLUDE_PATHS: "$(inherited) $(BUILT_PRODUCTS_DIR)"
