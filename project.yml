# XcodeGen spec for the Xcode project.
#
# ⚠️ **DO NOT RUN `xcodegen generate` — it is currently destructive.** This
# header used to say the opposite ("the authoritative, reproducible way to
# (re)generate the Xcode project", plus a `cd ios` that has never existed here).
# Measured on 2026-08-08 with XcodeGen 2.46.0, from a clean tree, changing
# nothing:
#
#     project.pbxproj                  1401 lines changed
#     xcshareddata/…/HealthInsights.xcscheme    34 lines changed
#     Support/Info.plist       197 of 213 lines DELETED
#
# The Info.plist is the one that matters. The target declares `info: path:` with
# no `properties:`, so XcodeGen treats the file as *its* output and overwrites it
# with a 16-line stub — taking every HealthKit/Health-Records usage description,
# the background modes, and the launch-screen fix with it. The app would still
# build and would be rejected by the first permission prompt it reached.
#
# The committed .xcodeproj has been hand-maintained since (stable
# `AAAA0000…` blueprint ids rather than XcodeGen's content hashes are the tell),
# so this spec is now **documentation of intent, not a generator**. Edit the spec
# *and* the .xcodeproj together, by hand, and keep them saying the same thing.
#
# Making regeneration safe again is its own job and is not small: every key in
# `Support/Info.plist` has to move into `targets.HealthInsights.info.properties`
# here, comments and all, and the result has to be diffed against the current
# plist before anyone trusts it.
#
name: HealthInsights
options:
  bundleIdPrefix: com.healthinsights
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  InsightKit:
    path: InsightKit

targets:
  # ⚠️ **The widget extension target EXISTS (since 2026-08-08) but nothing
  # embeds or signs it.** Backlog `D8`. It is defined below and is present in
  # the hand-maintained .xcodeproj (ids AAAA…AA21–AA2E), builds via its own
  # scheme with signing off, and is deliberately absent from the app target's
  # `dependencies` — so ci.yml, verify.sh and deploy.yml, which all build
  # `-scheme HealthInsights`, sign and ship exactly what they did before.
  # Adding the `- target: HealthInsightsWidgets / embed: true` dependency is
  # the whole of "switch the widget on", and it will turn the deploy red until
  # two things exist that this repo cannot grant itself. Read `docs/widgets.md`
  # §3 first; it names both, and what happens if you skip them.
  HealthInsights:
    type: application
    platform: iOS
    sources:
      - path: HealthInsights
    dependencies:
      - package: InsightKit
    info:
      path: Support/Info.plist
    # ── Scheme ────────────────────────────────────────────────────────────
    # `D54` item 2: Xcode's **Thread Performance Checker** (Diagnostics ▸
    # Runtime Sanitization) — main-thread hangs and priority inversions,
    # reported as runtime issues. It is a *scheme* setting, not a build
    # setting, which is why it could not ride along with the watchdog and the
    # MetricKit reporter.
    #
    # ⚠️ **`false` here writes nothing.** Verified against XcodeGen 2.46.0:
    # the key is `disableThreadPerformanceChecker`, it is disable-only, and it
    # emits `disablePerformanceAntipatternChecker = "YES"` on the LaunchAction
    # when true and *omits the attribute entirely* when false. The attribute
    # being absent is Xcode's default, and Xcode's default is **enabled** —
    # which is precisely why XcodeGen only ever offered a way to turn it off.
    # So the line below is a pin, not a switch: it records that the checker is
    # meant to be on, and it is the thing to look at first if someone reports
    # the runtime issues have stopped appearing.
    #
    # The committed `HealthInsights.xcscheme` states it the other way round,
    # `disablePerformanceAntipatternChecker = "NO"` — explicitly on rather than
    # on-by-omission — because a default is only a default until a
    # LastUpgradeVersion bump changes it, and this repo cannot re-run
    # `xcodegen generate` to repair the scheme (see the header note above).
    scheme:
      disableThreadPerformanceChecker: false
      testTargets:
        - HealthInsightsTests
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.jasonsalway.healthinsights
        PRODUCT_NAME: HealthInsights
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: Support/HealthInsights.entitlements
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
    # ⚠️ To embed the widget (docs/widgets.md §3 ONLY — this turns the deploy
    # red until the paid-team prerequisites exist), add alongside
    # `- package: InsightKit` above:
    #   - target: HealthInsightsWidgets
    #     embed: true
    # …and remember `xcodegen generate` must NOT be run (header): the same
    # change in the .xcodeproj is a PBXTargetDependency + container proxy on
    # the app target plus an "Embed Foundation Extensions" copy-files phase
    # (dstSubfolderSpec 13) carrying HealthInsightsWidgets.appex.

  # ─────────────────────────────────────────────────────────────────────────
  # The home-screen widget extension. Backlog `D8`. See `docs/widgets.md`.
  #
  # **Built but not shipped.** The target exists in the .xcodeproj and compiles
  # on demand — `xcodebuild build -scheme HealthInsightsWidgets -destination
  # 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO` — so the WidgetKit glue in
  # HealthInsightsWidgets/ can no longer rot uncompiled. It is NOT a dependency
  # of the app target and is in no scheme any gate builds, because shipping it
  # cannot happen yet:
  #   • `Support/HealthInsightsWidgets.entitlements` exists and declares the
  #     App Group `group.com.jasonsalway.healthinsights` (matching
  #     `WidgetSnapshotStore.appGroupIdentifier`). The SAME group must one day
  #     be added to `Support/HealthInsights.entitlements` — it is deliberately
  #     absent there today, because App Groups cannot be signed by a free
  #     personal team and the app target is signed on every push to main.
  #     Without the app-side half the widget reads an empty container and shows
  #     its placeholder forever — silently, which is why
  #     `WidgetSnapshotStore.isVisibleToWidgets` exists.
  #   • The deploy runner has no Xcode account to mint a profile for a second
  #     bundle id. Both blockers are quoted verbatim in `docs/deployment.md`.
  #
  # Note `sources`: two files from the app target are compiled into the
  # extension as well (in the .xcodeproj this is the
  # PBXFileSystemSynchronizedBuildFileExceptionSet on the HealthInsights
  # folder). An extension cannot link the containing app, so a shared view has
  # to be shared by *source*. Keep that list at two — anything longer means
  # logic has drifted out of InsightKit, where the tests are.
  #
  # The NSExtension dict lives in Support/HealthInsightsWidgets-Info.plist
  # (merged via INFOPLIST_FILE + GENERATE_INFOPLIST_FILE) because there is no
  # INFOPLIST_KEY_ spelling for it — an earlier draft of this block guessed
  # `INFOPLIST_KEY_NSExtensionPointIdentifier`, which does not exist.
  HealthInsightsWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: HealthInsightsWidgets
      - path: HealthInsights/Features/Widgets/DailyNumberWidgetView.swift
      - path: HealthInsights/DesignSystem/Theme.swift
    dependencies:
      - package: InsightKit
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jasonsalway.healthinsights.Widgets
        PRODUCT_NAME: HealthInsightsWidgets
        CODE_SIGN_ENTITLEMENTS: Support/HealthInsightsWidgets.entitlements
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Support/HealthInsightsWidgets-Info.plist
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  # ─────────────────────────────────────────────────────────────────────────

  # The app target's unit tests. Added 2026-08-07 — before that the app target
  # had none at all, and 39% of the shipped Swift (every render site, every
  # visibility gate, every `AppModel` transition) was checked only by a compile.
  #
  # ⚠️ **Mac-only, permanently.** A unit-test bundle hosted in an iOS app needs
  # the iOS SDK to build and an iOS simulator to run. Hosted Linux sessions have
  # neither, and neither does `ci.yml`'s runner — so **CI does not and cannot
  # gate this target**, and nobody should treat that as an oversight.
  # `scripts/verify.sh --tests` runs it on Darwin and says so out loud when it
  # skips it. See HealthInsightsTests/AppTargetTestSupport.swift.
  #
  # Hosted (TEST_HOST/BUNDLE_LOADER) rather than standalone, so the app's 28k
  # lines are compiled once for the app and the test bundle links against them.
  # It deliberately does **not** take its own InsightKit package dependency:
  # SwiftPM products build as static libraries here, a second copy inside the
  # test bundle would give the same types two sets of metadata in one process,
  # and `@testable import HealthInsights` would then hand back values the test's
  # own `InsightKit` types do not match. SWIFT_INCLUDE_PATHS gives the compiler
  # the module; BUNDLE_LOADER resolves the symbols against the host at link time.
  HealthInsightsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HealthInsightsTests
    dependencies:
      - target: HealthInsights
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jasonsalway.healthinsights.tests
        PRODUCT_NAME: HealthInsightsTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HealthInsights.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/HealthInsights"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_INCLUDE_PATHS: "$(inherited) $(BUILT_PRODUCTS_DIR)"
